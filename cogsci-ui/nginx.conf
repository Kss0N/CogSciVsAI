server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Redirect all traffic to index.html for React Router to handle
        try_files $uri $uri/ /index.html;
    }

    # ANY REQUEST STARTING WITH /api/ WILL BE ROUTED TO THE PYTHON CONTROLLER
    location /api/ {
        # Match this exactly to the app's docker-compose service name (app)
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
